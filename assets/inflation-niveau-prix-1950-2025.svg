<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="t d"><title id="t">Niveau cumulé des prix, base 100 en 1950</title><desc id="d">Indice indicatif reconstitué à partir des taux annuels moyens de l'Insee, montrant l'effet cumulatif de l'inflation de 1950 à 2025.</desc><rect width="1200" height="560" rx="24" fill="#0b0e11"/><text x="80" y="38" fill="#f4f1ea" font-size="25" font-family="Arial,sans-serif" font-weight="700">Niveau cumulé des prix · base 100 en 1950</text><text x="80" y="61" fill="#9faab2" font-size="14" font-family="Arial,sans-serif">L’inflation ralentit parfois ; les hausses de prix déjà accumulées, elles, ne disparaissent pas.</text><line x1="80" y1="480" x2="1160" y2="480" stroke="#27313a"/><line x1="80" y1="388.7" x2="1160" y2="388.7" stroke="#27313a"/><line x1="80" y1="297.4" x2="1160" y2="297.4" stroke="#27313a"/><line x1="80" y1="206.1" x2="1160" y2="206.1" stroke="#27313a"/><line x1="80" y1="114.8" x2="1160" y2="114.8" stroke="#27313a"/><text x="66" y="485" text-anchor="end" fill="#9faab2" font-size="13" font-family="Arial">0</text><text x="66" y="393.7" text-anchor="end" fill="#9faab2" font-size="13" font-family="Arial">500</text><text x="66" y="302.4" text-anchor="end" fill="#9faab2" font-size="13" font-family="Arial">1 000</text><text x="66" y="211.1" text-anchor="end" fill="#9faab2" font-size="13" font-family="Arial">1 500</text><text x="66" y="119.8" text-anchor="end" fill="#9faab2" font-size="13" font-family="Arial">2 000</text><polygon points="80,461.7 224,447.8 368,432.2 512,357.5 656,254.6 800,212.5 944,162.8 1088,129.0 1160,75.0 1160,480 80,480" fill="#d4ab56" opacity="0.10"/><polyline points="80,461.7 224,447.8 368,432.2 512,357.5 656,254.6 800,212.5 944,162.8 1088,129.0 1160,75.0" fill="none" stroke="#d4ab56" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><g fill="#f4f1ea" stroke="#d4ab56" stroke-width="3"><circle cx="80" cy="461.7" r="6"/><circle cx="224" cy="447.8" r="6"/><circle cx="368" cy="432.2" r="6"/><circle cx="512" cy="357.5" r="6"/><circle cx="656" cy="254.6" r="6"/><circle cx="800" cy="212.5" r="6"/><circle cx="944" cy="162.8" r="6"/><circle cx="1088" cy="129.0" r="6"/><circle cx="1160" cy="75.0" r="6"/></g><g fill="#c7d0d5" font-size="12" font-family="Arial" text-anchor="middle"><text x="80" y="510">1950</text><text x="224" y="510">1960</text><text x="368" y="510">1970</text><text x="512" y="510">1980</text><text x="656" y="510">1990</text><text x="800" y="510">2000</text><text x="944" y="510">2010</text><text x="1088" y="510">2020</text><text x="1160" y="510">2025</text></g><g fill="#f0d48a" font-size="13" font-family="Arial" font-weight="700"><text x="92" y="449">100</text><text x="524" y="345">671</text><text x="668" y="242">1 234</text><text x="812" y="200">1 465</text><text x="1099" y="116">1 922</text><text x="1094" y="92">2 218</text></g><text x="80" y="544" fill="#7f8b94" font-size="11" font-family="Arial">Lecture : un panier à l’indice 100 en 1950 atteint environ 2 218 en 2025. Reconstitution indicative par composition des taux annuels Insee.</text></svg>