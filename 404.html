<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Page déplacée — Contre-Évidence</title>
<meta name="description" content="Contre-Évidence est désormais disponible à sa nouvelle adresse.">
<script>
(function(){
  var p = location.pathname.replace(/^\/Esquisse(?:\/|$)/, '/');
  if (!p || p === '/Esquisse') p = '/';
  location.replace('https://contreevidence.github.io' + p + location.search + location.hash);
})();
</script></head><body><main><h1>Contre-Évidence a déménagé.</h1><p><a href="https://contreevidence.github.io/">Ouvrir le nouveau site</a></p></main></body></html>
