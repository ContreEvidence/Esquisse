name: Diagnostiquer le coeur de la consolidation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/core-build-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Tester les etapes de construction
        shell: bash
        run: |
          mkdir -p editorial
          R=editorial/core-build-diagnostic.md
          printf '# Diagnostic coeur de build\n\nExécuté le %s\n\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > "$R"
          set +e
          for spec in \
            'durcissement|node scripts/hardening-pass.cjs' \
            'nettoyage|node scripts/clean-legacy-pages.cjs' \
            'normalisation|node scripts/normalize-editorial-data.cjs' \
            'consolidation|node scripts/consolidate-site.cjs' \
            'ux|node scripts/add-ux-layer.cjs' \
            'mon-espace|node scripts/add-personal-space.cjs' \
            'durcissement-post|node scripts/hardening-pass.cjs'
          do
            NAME="${spec%%|*}"
            CMD="${spec#*|}"
            printf '## %s\n\n' "$NAME" >> "$R"
            timeout 45s bash -lc "$CMD" > /tmp/stage.log 2>&1
            CODE=$?
            printf -- '- code: `%s`\n\n```text\n' "$CODE" >> "$R"
            tail -n 60 /tmp/stage.log >> "$R"
            printf '\n```\n\n' >> "$R"
          done
          set -e
      - name: Publier le diagnostic
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add editorial/core-build-diagnostic.md
          git commit -m "Diagnostiquer le coeur du build"
          git push
