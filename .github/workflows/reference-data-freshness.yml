name: Reference data freshness

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "assets/reference-data.json"
      - ".github/workflows/reference-data-freshness.yml"

permissions:
  contents: read

jobs:
  validate-reference-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate official-source references and freshness
        shell: python
        run: |
          from __future__ import annotations
          import datetime as dt
          import json
          import pathlib
          import sys
          import urllib.parse

          path = pathlib.Path('assets/reference-data.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          errors = []
          warnings = []

          checked = data.get('meta', {}).get('lastChecked')
          if not checked:
              errors.append('meta.lastChecked absent')
          else:
              try:
                  checked_date = dt.date.fromisoformat(checked)
                  age = (dt.date.today() - checked_date).days
                  if age < 0:
                      warnings.append(f'meta.lastChecked est dans le futur ({checked})')
                  elif age > 45:
                      errors.append(f'données de référence non revérifiées depuis {age} jours (seuil: 45)')
                  elif age > 30:
                      warnings.append(f'données de référence âgées de {age} jours')
              except ValueError:
                  errors.append(f'meta.lastChecked invalide: {checked!r}')

          allowed_hosts = {
              'www.banque-france.fr', 'banque-france.fr',
              'www.economie.gouv.fr', 'economie.gouv.fr',
              'www.legifrance.gouv.fr', 'legifrance.gouv.fr',
              'www.service-public.fr', 'service-public.fr',
              'www.service-public.gouv.fr', 'service-public.gouv.fr',
              'www.francetravail.fr', 'francetravail.fr',
              'www.transitionspro.fr', 'transitionspro.fr',
              'www.moncompteformation.gouv.fr', 'moncompteformation.gouv.fr',
              'www.francecompetences.fr', 'francecompetences.fr'
          }

          def walk(value, trail='root'):
              if isinstance(value, dict):
                  for key, item in value.items():
                      here = f'{trail}.{key}'
                      if key.lower().endswith(('sourceurl','reuseurl')) and isinstance(item, str):
                          parsed = urllib.parse.urlparse(item)
                          if parsed.scheme != 'https':
                              errors.append(f'{here}: URL non HTTPS: {item}')
                          elif parsed.hostname not in allowed_hosts:
                              errors.append(f'{here}: domaine non autorisé pour les données de référence: {parsed.hostname}')
                      walk(item, here)
              elif isinstance(value, list):
                  for i, item in enumerate(value):
                      walk(item, f'{trail}[{i}]')

          walk(data)

          required = [
              ('mortgage.hcsf.maxEffortRate', data.get('mortgage',{}).get('hcsf',{}).get('maxEffortRate')),
              ('mortgage.hcsf.maxMaturityYears', data.get('mortgage',{}).get('hcsf',{}).get('maxMaturityYears')),
              ('mortgage.marketReference.housingLoanAverageRate', data.get('mortgage',{}).get('marketReference',{}).get('housingLoanAverageRate')),
              ('regulatedSavings.livretA.rate', data.get('regulatedSavings',{}).get('livretA',{}).get('rate')),
          ]
          for name, value in required:
              if value is None:
                  errors.append(f'{name} absent')

          for warning in warnings:
              print(f'WARNING: {warning}')
          if errors:
              for error in errors:
                  print(f'ERROR: {error}')
              sys.exit(1)

          print('OK — fichier de référence présent, récent et limité aux domaines officiels autorisés.')
          print('Ce contrôle ne met jamais à jour automatiquement un taux ou une règle : une vérification humaine des valeurs et méthodologies reste nécessaire.')
