name: Enrichir les dossiers avec les donnees wave 2

on:
  push:
    branches: [main]
    paths:
      - 'scripts/enrich-wave2b-tax-retirement-work-20260809.cjs'
      - 'scripts/enrich-wave2c-bfr-20260809.cjs'
      - '.github/workflows/enrich-wave2.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: enrichissement-editorial-wave2
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Appliquer fiscalite retraite transmission emploi et BFR
        run: |
          node scripts/enrich-wave2b-tax-retirement-work-20260809.cjs
          node scripts/enrich-wave2c-bfr-20260809.cjs

      - name: Publier les enrichissements
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dossiers/finances-enveloppes-fiscalite.html \
            dossiers/finances-retraite-decumulation.html \
            dossiers/finances-transmission-patrimoine.html \
            dossiers/formation-vaut-elle-le-cout.html \
            dossiers/negocier-salaire-responsabilites.html \
            dossiers/tresorerie-bfr-entreprise.html \
            assets/editorial-data.json \
            editorial/audit-chiffrage-bibliotheque.md

          if git diff --cached --quiet; then
            echo "Aucun enrichissement a publier."
            exit 0
          fi

          git commit -m "Enrichir fiscalite retraite transmission emploi et tresorerie"
          git pull --rebase origin main
          git push
