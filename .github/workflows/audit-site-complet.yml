name: Audit complet du site

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'bibliotheque.html'
      - 'parcours-*.html'
      - 'themes/**'
      - 'articles/**'
      - 'dossiers/**'
      - 'assets/**'
      - 'sitemap.xml'
      - 'robots.txt'
      - 'manifest.webmanifest'
      - 'scripts/audit-site-complet-20260809.cjs'
      - '.github/workflows/audit-site-complet.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: audit-complet-site
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Auditer le site
        run: node scripts/audit-site-complet-20260809.cjs

      - name: Publier le rapport si necessaire
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add editorial/audit-complet-site-20260809.md editorial/audit-complet-site-20260809.json
          if git diff --cached --quiet; then
            echo "Audit inchangé."
            exit 0
          fi
          git commit -m "Mettre a jour l audit complet du site"
          git pull --rebase origin main
          git push
