name: Enrichir assurance capacité clients et automatisation

on:
  push:
    branches: [main]
    paths:
      - 'scripts/enrich-wave3b-risks-capacity-automation-20260809.cjs'
      - '.github/workflows/enrich-wave3.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: enrichissement-editorial-wave3
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Appliquer les enrichissements de la vague 3
        run: node scripts/enrich-wave3b-risks-capacity-automation-20260809.cjs

      - name: Publier les enrichissements
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dossiers/assurer-ou-autoassurer-risques.html \
            dossiers/dependance-gros-client.html \
            dossiers/embaucher-ou-sous-traiter.html \
            dossiers/automatiser-ou-non-processus.html \
            assets/editorial-data.json \
            editorial/audit-chiffrage-bibliotheque.md

          if git diff --cached --quiet; then
            echo "Aucun enrichissement a publier."
            exit 0
          fi

          git commit -m "Enrichir assurance clients capacité et automatisation"
          git pull --rebase origin main
          git push
