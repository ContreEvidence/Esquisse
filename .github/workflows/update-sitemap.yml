name: Update sitemap

on:
  push:
    branches: [main]
    paths:
      - '**/*.html'
      - '.github/workflows/update-sitemap.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sitemap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate sitemap from indexable HTML pages
        shell: python
        run: |
          from pathlib import Path
          from datetime import datetime, timezone
          from xml.sax.saxutils import escape
          import re
          import subprocess

          root = Path('.')
          base = 'https://contreevidence.github.io/Esquisse/'
          excluded_names = {'404.html'}

          urls = []
          for path in sorted(root.rglob('*.html')):
              rel = path.as_posix()
              if any(part.startswith('.') for part in path.parts):
                  continue
              if path.name in excluded_names:
                  continue
              text = path.read_text(encoding='utf-8', errors='ignore')
              if re.search(r'<meta[^>]+name=["\']robots["\'][^>]+content=["\'][^"\']*noindex', text, re.I):
                  continue
              if re.search(r'<meta[^>]+content=["\'][^"\']*noindex[^"\']*["\'][^>]+name=["\']robots["\']', text, re.I):
                  continue
              url = base if rel == 'index.html' else base + rel
              try:
                  stamp = subprocess.check_output(['git','log','-1','--format=%cs','--',rel], text=True).strip()
              except Exception:
                  stamp = ''
              if not stamp:
                  stamp = datetime.now(timezone.utc).date().isoformat()
              urls.append((url, stamp))

          lines = ['<?xml version="1.0" encoding="UTF-8"?>','<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">']
          for url, stamp in urls:
              lines.append(f'  <url><loc>{escape(url)}</loc><lastmod>{stamp}</lastmod></url>')
          lines.append('</urlset>')
          Path('sitemap.xml').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          print(f'Sitemap generated with {len(urls)} indexable HTML pages.')

      - name: Commit sitemap if changed
        run: |
          if git diff --quiet -- sitemap.xml; then
            echo "sitemap.xml is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml
          git commit -m "Mise à jour automatique du sitemap"
          git push
