name: Content depth audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/content-depth-audit.yml"

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inventory depth of indexable dossiers and articles
        shell: python
        run: |
          from __future__ import annotations
          import html
          import pathlib
          import re
          import urllib.parse
          import xml.etree.ElementTree as ET

          root = pathlib.Path('.').resolve()
          prefix = 'https://contreevidence.github.io/Esquisse/'
          ns = {'s':'http://www.sitemaps.org/schemas/sitemap/0.9'}
          sitemap = ET.parse('sitemap.xml')
          urls = [n.text.strip() for n in sitemap.findall('.//s:loc', ns) if n.text]

          script_re = re.compile(r'<(script|style)\b.*?</\1>', re.I | re.S)
          tag_re = re.compile(r'<[^>]+>')
          h2_re = re.compile(r'<h2\b', re.I)
          table_re = re.compile(r'<table\b', re.I)
          source_re = re.compile(r'href=["\']https?://([^/"\']+)', re.I)
          word_re = re.compile(r"[A-Za-zÀ-ÖØ-öø-ÿ0-9]+(?:['’\-][A-Za-zÀ-ÖØ-öø-ÿ0-9]+)*")

          official = (
              'banque-france.fr','economie.gouv.fr','service-public.fr','service-public.gouv.fr',
              'legifrance.gouv.fr','amf-france.org','francetravail.fr','francecompetences.fr',
              'moncompteformation.gouv.fr','transitionspro.fr','insee.fr','urssaf.fr','impots.gouv.fr'
          )

          rows = []
          for url in urls:
              if not url.startswith(prefix):
                  continue
              rel = urllib.parse.unquote(url[len(prefix):]) or 'index.html'
              if not (rel.startswith('dossiers/') or rel.startswith('articles/')):
                  continue
              page = root / rel
              if not page.exists():
                  continue
              raw = page.read_text(encoding='utf-8', errors='replace')
              visible = script_re.sub(' ', raw)
              visible = html.unescape(tag_re.sub(' ', visible))
              words = len(word_re.findall(visible))
              h2 = len(h2_re.findall(raw))
              tables = len(table_re.findall(raw))
              hosts = [h.lower() for h in source_re.findall(raw)]
              official_links = sum(1 for host in hosts if any(host == d or host.endswith('.'+d) for d in official))
              external_links = len(hosts)
              rows.append((words, rel, h2, tables, official_links, external_links))

          rows.sort()
          print(f'Indexable dossiers/articles: {len(rows)}')
          print('\n20 contenus les plus courts:')
          print('mots | h2 | tableaux | liens officiels | liens externes | fichier')
          for words, rel, h2, tables, official_links, external_links in rows[:20]:
              print(f'{words:4} | {h2:2} | {tables:2} | {official_links:2} | {external_links:2} | {rel}')

          print('\nContenus sous seuil indicatif (dossier < 900 mots ; article < 700 mots):')
          flagged = []
          for row in rows:
              words, rel, *_ = row
              threshold = 900 if rel.startswith('dossiers/') else 700
              if words < threshold:
                  flagged.append(row)
          if not flagged:
              print('Aucun.')
          else:
              for words, rel, h2, tables, official_links, external_links in flagged:
                  print(f'{words:4} mots | {h2} h2 | {tables} tableaux | {official_links} officiels | {rel}')

          print('\nContenus longs sans lien externe officiel détecté (signal de revue, pas erreur):')
          for words, rel, h2, tables, official_links, external_links in rows:
              if words >= 1200 and official_links == 0:
                  print(f'{words:4} mots | {rel}')

          print('\nAudit informatif uniquement : la longueur n’est pas un critère de classement et un contenu court peut être la meilleure réponse à une intention précise.')
