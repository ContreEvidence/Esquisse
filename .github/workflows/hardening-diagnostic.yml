name: Diagnostiquer le durcissement

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hardening-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Tester la syntaxe du durcissement
        shell: bash
        run: |
          mkdir -p editorial
          node --check scripts/hardening-pass.cjs > editorial/hardening-diagnostic.md 2>&1 || true
          printf '\n--- execution ---\n' >> editorial/hardening-diagnostic.md
          node scripts/hardening-pass.cjs >> editorial/hardening-diagnostic.md 2>&1 || true
      - name: Publier le diagnostic
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add editorial/hardening-diagnostic.md
          git commit -m "Diagnostiquer le durcissement du site"
          git push
