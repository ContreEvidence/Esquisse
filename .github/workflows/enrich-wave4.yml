name: Enrichir les dossiers decisions management et processus

on:
  push:
    branches: [main]
    paths:
      - 'scripts/enrich-wave4-decisions-management-process-20260809.cjs'
      - '.github/workflows/enrich-wave4.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: enrichissement-editorial-wave4
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Appliquer les enrichissements
        run: node scripts/enrich-wave4-decisions-management-process-20260809.cjs

      - name: Publier les enrichissements
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dossiers/quitter-emploi-stable-ou-rester.html \
            dossiers/devenir-manager-premiere-fois.html \
            dossiers/ameliorer-processus-sans-degrader-service.html \
            dossiers/decider-sans-tourner-en-rond.html \
            assets/editorial-data.json \
            editorial/audit-chiffrage-bibliotheque.md

          if git diff --cached --quiet; then
            echo "Aucun enrichissement a publier."
            exit 0
          fi

          git commit -m "Enrichir decisions management et processus"
          git pull --rebase origin main
          git push
