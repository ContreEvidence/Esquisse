name: Verifier GitHub Actions

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/actions-smoke.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Ecrire le temoin
        shell: bash
        run: |
          mkdir -p editorial
          printf '# GitHub Actions — test minimal\n\nExécuté le %s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > editorial/actions-smoke-test.md
      - name: Publier le temoin
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add editorial/actions-smoke-test.md
          git commit -m "Valider le fonctionnement de GitHub Actions"
          git push
