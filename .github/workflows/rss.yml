name: Mettre a jour le flux RSS et les publications

on:
  push:
    branches: [main]
    paths:
      - 'articles/**'
      - 'dossiers/**'
      - 'themes/**'
      - '*.html'
      - 'outil*.html'
      - 'simulateur*.html'
      - 'assets/library-catalog.js'
      - 'assets/library-daily-money.js'
      - 'assets/tools-catalog.js'
      - 'assets/follow.js'
      - 'scripts/generate-rss.cjs'
      - 'scripts/generate-publication-drafts.cjs'
      - 'scripts/enrich-wave1b-20260809.cjs'
      - 'scripts/enrich-wave1c-lumpsum-20260809.cjs'
      - 'scripts/enrich-wave1d-secure-employment-20260809.cjs'
      - 'scripts/enrich-wave2a-immobilier-20260809.cjs'
      - 'scripts/enrich-wave2b-tax-retirement-work-20260809.cjs'
      - 'scripts/build-social-package.cjs'
      - 'scripts/publish-social.cjs'
      - 'publications/social-config.json'
      - '.github/workflows/rss.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rss-et-social
  cancel-in-progress: false

jobs:
  rss:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Appliquer les enrichissements chiffres valides
        run: |
          node scripts/enrich-wave1b-20260809.cjs
          node scripts/enrich-wave1c-lumpsum-20260809.cjs
          node scripts/enrich-wave1d-secure-employment-20260809.cjs
          node scripts/enrich-wave2a-immobilier-20260809.cjs
          node scripts/enrich-wave2b-tax-retirement-work-20260809.cjs

      - name: Generer les flux RSS et le module Suivre
        run: node scripts/generate-rss.cjs

      - name: Preparer les publications sociales
        run: node scripts/generate-publication-drafts.cjs

      - name: Installer le moteur de medias sociaux
        run: npm install --no-save --no-package-lock sharp

      - name: Verifier ffmpeg
        shell: bash
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version | head -n 1

      - name: Construire le prochain media depuis le RSS
        run: node scripts/build-social-package.cjs

      - name: Publier les fichiers generes dans le depot
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A -- '*.html' articles dossiers themes assets/follow.js 'rss*.xml' rss-feeds.json publications/a-publier.md \
            assets/editorial-data.json editorial/audit-chiffrage-bibliotheque.md

          if [ -f publications/social-package.json ]; then
            git add publications/social-package.json
          fi
          if [ -d publications/media ]; then
            git add publications/media
          fi

          if git diff --cached --quiet; then
            echo "Aucune modification a publier."
          else
            git commit -m "Mettre a jour contenus RSS et media social"
            git push
            sleep 12
          fi

      - name: Envoyer vers les comptes sociaux autorises
        env:
          META_PAGE_NAME: Contre-Évidence
          META_USER_ACCESS_TOKEN: ${{ secrets.META_USER_ACCESS_TOKEN }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
          META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
          TIKTOK_ACCESS_TOKEN: ${{ secrets.TIKTOK_ACCESS_TOKEN }}
          TIKTOK_PRIVACY_LEVEL: ${{ secrets.TIKTOK_PRIVACY_LEVEL }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_PRIVACY_STATUS: ${{ secrets.YOUTUBE_PRIVACY_STATUS }}
          YOUTUBE_CATEGORY_ID: ${{ secrets.YOUTUBE_CATEGORY_ID }}
        run: node scripts/publish-social.cjs

      - name: Enregistrer l'anti-doublon et les resultats d'envoi
        shell: bash
        run: |
          if git diff --quiet -- publications/social-state.json; then
            echo "Aucun nouvel etat de publication a enregistrer."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add publications/social-state.json
          git commit -m "Enregistrer l'etat des publications sociales"
          git pull --rebase origin main
          git push

# Un seul workflow fait désormais toute la chaine : catalogue -> RSS général + flux thématiques ->
# diffusion du bouton Suivre -> brouillons -> media vertical -> mise a disposition publique ->
# envoi API -> anti-doublon. Si aucun secret social n'est present, le media est tout de meme genere.
