name: Consolider publier et diffuser Contre-Evidence

on:
  push:
    branches: [main]
    paths:
      - 'articles/**'
      - 'dossiers/**'
      - 'themes/**'
      - '*.html'
      - 'outil*.html'
      - 'simulateur*.html'
      - 'assets/library-catalog.js'
      - 'assets/library-daily-money.js'
      - 'assets/tools-catalog.js'
      - 'assets/editorial-data.json'
      - 'assets/follow.js'
      - 'assets/home.css'
      - 'assets/style.css'
      - 'assets/brand.css'
      - 'assets/library.js'
      - 'assets/analytics-config.json'
      - 'assets/analytics-loader.js'
      - 'scripts/clean-legacy-pages.cjs'
      - 'scripts/consolidate-site.cjs'
      - 'scripts/add-related-content.cjs'
      - 'scripts/generate-search-index.cjs'
      - 'scripts/add-analytics-loader.cjs'
      - 'scripts/audit-site.cjs'
      - 'scripts/normalize-editorial-data.cjs'
      - 'scripts/check-editorial-data-freshness.cjs'
      - 'scripts/generate-rss.cjs'
      - 'scripts/generate-publication-drafts.cjs'
      - 'scripts/build-social-package.cjs'
      - 'scripts/attribute-acquisition-links.cjs'
      - 'scripts/check-social-auth.cjs'
      - 'scripts/publish-social.cjs'
      - 'publications/social-config.json'
      - '.github/workflows/rss.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: consolidation-et-diffusion
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Nettoyer et archiver les anciennes pages
        run: node scripts/clean-legacy-pages.cjs

      - name: Normaliser les références du référentiel chiffré
        run: node scripts/normalize-editorial-data.cjs

      - name: Consolider SEO dates sitemap et navigation de secours
        run: node scripts/consolidate-site.cjs

      - name: Préparer le chargeur de mesure d audience
        run: node scripts/add-analytics-loader.cjs

      - name: Ajouter les parcours éditoriaux liés
        run: node scripts/add-related-content.cjs

      - name: Générer l index plein texte
        run: node scripts/generate-search-index.cjs

      - name: Generer les flux RSS
        run: node scripts/generate-rss.cjs

      - name: Verifier la fraîcheur entre données et dossiers
        run: node scripts/check-editorial-data-freshness.cjs

      - name: Auditer le site
        run: node scripts/audit-site.cjs

      - name: Preparer les publications sociales
        run: node scripts/generate-publication-drafts.cjs

      - name: Installer le moteur de medias sociaux
        run: npm install --no-save --package-lock=false sharp

      - name: Verifier ffmpeg
        shell: bash
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version | head -n 1

      - name: Construire le prochain media depuis le RSS
        run: node scripts/build-social-package.cjs

      - name: Attribuer les liens de diffusion
        run: node scripts/attribute-acquisition-links.cjs

      - name: Diagnostiquer les autorisations sociales
        env:
          META_USER_ACCESS_TOKEN: ${{ secrets.META_USER_ACCESS_TOKEN }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
          META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
          TIKTOK_ACCESS_TOKEN: ${{ secrets.TIKTOK_ACCESS_TOKEN }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: node scripts/check-social-auth.cjs

      - name: Publier les fichiers generes dans le depot
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- '*.html' articles dossiers themes sitemap.xml 'rss*.xml' rss-feeds.json publications/a-publier.md \
            assets/editorial-data.json assets/search-index.js editorial/audit-chiffrage-bibliotheque.md editorial/audit-technique-site.md editorial/data-freshness.md
          if [ -f publications/social-package.json ]; then git add publications/social-package.json; fi
          if [ -f publications/social-auth-status.json ]; then git add publications/social-auth-status.json; fi
          if [ -d publications/media ]; then git add publications/media; fi
          if git diff --cached --quiet; then
            echo "Aucune modification generee."
          else
            git commit -m "Consolider SEO parcours recherche sitemap RSS et diffusion"
            git pull --rebase origin main
            git push
            sleep 12
          fi

      - name: Envoyer vers les comptes sociaux autorises
        env:
          META_PAGE_NAME: Contre-Évidence
          META_USER_ACCESS_TOKEN: ${{ secrets.META_USER_ACCESS_TOKEN }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
          META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
          TIKTOK_ACCESS_TOKEN: ${{ secrets.TIKTOK_ACCESS_TOKEN }}
          TIKTOK_PRIVACY_LEVEL: ${{ secrets.TIKTOK_PRIVACY_LEVEL }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_PRIVACY_STATUS: ${{ secrets.YOUTUBE_PRIVACY_STATUS }}
          YOUTUBE_CATEGORY_ID: ${{ secrets.YOUTUBE_CATEGORY_ID }}
        run: node scripts/publish-social.cjs

      - name: Enregistrer l anti-doublon social
        shell: bash
        run: |
          if git diff --quiet -- publications/social-state.json; then
            echo "Aucun nouvel etat social."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add publications/social-state.json
          git commit -m "Enregistrer l etat des publications sociales"
          git pull --rebase origin main
          git push

# Pipeline unique : pages historiques -> référentiel -> SEO/dates/sitemap -> chargeur analytics -> parcours liés -> index plein texte -> RSS -> fraîcheur -> audit -> brouillons/media -> attribution UTM -> diffusion.
# Une nouvelle version annule une consolidation obsolète encore en cours.
