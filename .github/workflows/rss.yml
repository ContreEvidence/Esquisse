name: Mettre a jour le flux RSS et les publications

on:
  push:
    branches: [main]
    paths:
      - 'articles/**'
      - 'dossiers/**'
      - 'outil*.html'
      - 'simulateur*.html'
      - 'assets/library-catalog.js'
      - 'assets/library-daily-money.js'
      - 'assets/tools-catalog.js'
      - 'scripts/generate-rss.cjs'
      - 'scripts/generate-publication-drafts.cjs'
      - 'scripts/enrich-wave1b-20260809.cjs'
      - 'scripts/enrich-wave1c-lumpsum-20260809.cjs'
      - 'scripts/build-social-package.cjs'
      - 'scripts/publish-social.cjs'
      - 'publications/social-config.json'
      - '.github/workflows/rss.yml'
      - '.github/workflows/social-publish.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rss:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Appliquer les enrichissements chiffres valides
        run: |
          node scripts/enrich-wave1b-20260809.cjs
          node scripts/enrich-wave1c-lumpsum-20260809.cjs

      - name: Generer le flux RSS
        run: node scripts/generate-rss.cjs

      - name: Preparer les publications sociales
        run: node scripts/generate-publication-drafts.cjs

      - name: Publier les fichiers generes si necessaire
        shell: bash
        run: |
          if git diff --quiet -- rss.xml index.html bibliotheque.html publications/a-publier.md articles/comparatif-produits-bancaires.html articles/investir-grosse-somme-dun-coup-ou-progressivement.html dossiers/finances-credit-endettement.html dossiers/finances-allocation-portefeuille.html assets/editorial-data.json editorial/audit-chiffrage-bibliotheque.md; then
            echo "Aucune modification a publier."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rss.xml index.html bibliotheque.html publications/a-publier.md articles/comparatif-produits-bancaires.html articles/investir-grosse-somme-dun-coup-ou-progressivement.html dossiers/finances-credit-endettement.html dossiers/finances-allocation-portefeuille.html assets/editorial-data.json editorial/audit-chiffrage-bibliotheque.md
          git commit -m "Mettre a jour contenus chiffres RSS et brouillons sociaux"
          git push

# Ce workflow maintient le RSS et les brouillons. Le workflow social-publish.yml
# prend ensuite le relais pour fabriquer le media, appliquer l'anti-doublon et
# envoyer le contenu vers les comptes dont les autorisations sont presentes.
