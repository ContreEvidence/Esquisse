name: Mettre a jour le flux RSS et les publications

on:
  push:
    branches: [main]
    paths:
      - 'articles/**'
      - 'dossiers/**'
      - 'outil*.html'
      - 'simulateur*.html'
      - 'assets/library-catalog.js'
      - 'assets/library-daily-money.js'
      - 'assets/tools-catalog.js'
      - 'scripts/generate-rss.cjs'
      - 'scripts/generate-publication-drafts.cjs'
      - '.github/workflows/rss.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rss:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Generer le flux RSS
        run: node scripts/generate-rss.cjs

      - name: Preparer les publications sociales
        run: node scripts/generate-publication-drafts.cjs

      - name: Publier les fichiers generes si necessaire
        shell: bash
        run: |
          if git diff --quiet -- rss.xml index.html bibliotheque.html publications/a-publier.md; then
            echo "Aucune modification a publier."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rss.xml index.html bibliotheque.html publications/a-publier.md
          git commit -m "Mettre a jour RSS et brouillons sociaux"
          git push

# Ce workflow prépare les brouillons sans les publier sur les réseaux.
