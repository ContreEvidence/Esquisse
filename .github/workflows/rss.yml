name: Consolider et publier Contre-Evidence

on:
  push:
    branches: [main]
    paths:
      - 'articles/**'
      - 'dossiers/**'
      - 'themes/**'
      - 'fiches-metiers/**'
      - '*.html'
      - 'outil*.html'
      - 'simulateur*.html'
      - 'assets/library-catalog.js'
      - 'assets/library-daily-money.js'
      - 'assets/library-work-foundations.js'
      - 'assets/tools-catalog.js'
      - 'assets/editorial-data.json'
      - 'assets/follow.js'
      - 'assets/home.css'
      - 'assets/style.css'
      - 'assets/brand.css'
      - 'assets/library.js'
      - 'assets/orientation.js'
      - 'assets/navigation-v3.js'
      - 'assets/ux-retention.css'
      - 'assets/longform.js'
      - 'assets/personal-space.css'
      - 'assets/personal-space.js'
      - 'assets/finance-cockpit.css'
      - 'assets/finance-cockpit.js'
      - 'assets/finance-architecture.css'
      - 'assets/finance-architecture.js'
      - 'assets/analytics-config.json'
      - 'assets/analytics-loader.js'
      - 'scripts/site-version.cjs'
      - 'scripts/hardening-pass.cjs'
      - 'scripts/clean-legacy-pages.cjs'
      - 'scripts/consolidate-site.cjs'
      - 'scripts/add-ux-layer.cjs'
      - 'scripts/add-personal-space.cjs'
      - 'scripts/add-related-content.cjs'
      - 'scripts/generate-search-index.cjs'
      - 'scripts/add-analytics-loader.cjs'
      - 'scripts/audit-site.cjs'
      - 'scripts/audit-structure-site.cjs'
      - 'scripts/audit-legal-guardrails.cjs'
      - 'scripts/normalize-editorial-data.cjs'
      - 'scripts/check-editorial-data-freshness.cjs'
      - 'scripts/generate-rss.cjs'
      - '.github/workflows/rss.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: consolidation-site
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Durcir les couches structurelles
        run: node scripts/hardening-pass.cjs

      - name: Nettoyer et archiver les anciennes pages
        run: node scripts/clean-legacy-pages.cjs

      - name: Normaliser les références du référentiel chiffré
        run: node scripts/normalize-editorial-data.cjs

      - name: Consolider SEO dates sitemap et navigation de secours
        run: node scripts/consolidate-site.cjs

      - name: Stabiliser le rendu et les parcours de lecture longue
        run: node scripts/add-ux-layer.cjs

      - name: Activer Mon espace personnel local
        run: node scripts/add-personal-space.cjs

      - name: Vérifier la syntaxe des moteurs front
        run: node --check assets/personal-space.js && node --check assets/finance-cockpit.js && node --check assets/finance-architecture.js && node --check assets/follow.js && node --check assets/navigation-v3.js && node --check assets/longform.js

      - name: Vérifier les garde-fous juridiques et de collecte
        run: node scripts/audit-legal-guardrails.cjs

      - name: Préparer le chargeur de mesure d audience
        run: node scripts/add-analytics-loader.cjs

      - name: Ajouter les parcours éditoriaux liés
        run: node scripts/add-related-content.cjs

      - name: Générer l index plein texte
        run: node scripts/generate-search-index.cjs

      - name: Generer les flux RSS
        run: node scripts/generate-rss.cjs

      - name: Verifier la fraîcheur entre données et dossiers
        run: node scripts/check-editorial-data-freshness.cjs

      - name: Auditer les liens SEO et catalogues
        run: node scripts/audit-site.cjs

      - name: Auditer la structure UX et les versions
        run: node scripts/audit-structure-site.cjs

      - name: Publier immédiatement la version consolidée du site
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- '*.html' articles dossiers themes fiches-metiers sitemap.xml 'rss*.xml' rss-feeds.json \
            assets scripts editorial/audit-chiffrage-bibliotheque.md editorial/audit-technique-site.md editorial/audit-structure-site.md editorial/data-freshness.md
          if git diff --cached --quiet; then
            echo "Aucune modification generee."
          else
            git commit -m "Consolider le site et ses audits"
            git pull --rebase origin main
            git push
          fi

# Pipeline du site uniquement : durcissement -> nettoyage -> référentiel -> SEO/sitemap -> UX -> Mon espace -> garde-fous -> recherche -> RSS -> fraîcheur -> audits -> publication.
# La diffusion sociale est volontairement découplée : elle ne peut plus bloquer la mise en ligne du site.
