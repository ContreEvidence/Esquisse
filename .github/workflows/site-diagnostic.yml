name: Diagnostiquer le pipeline site

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/site-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Executer le diagnostic complet
        run: node scripts/diagnose-pipeline.cjs
      - name: Publier uniquement le diagnostic
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add editorial/site-diagnostic.md
          git commit -m "Diagnostiquer le pipeline du site"
          git pull --rebase origin main
          git push
